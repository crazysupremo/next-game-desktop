<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0; height: 100%; background: #05070d; color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  img { width: 120px; margin-bottom: 24px; opacity: 0.95; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15); border-top-color: #5865f2;
    animation: spin 0.8s linear infinite; margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 13px; color: #8b93a7; margin: 0; text-align: center; max-width: 320px; line-height: 1.5; }
  #status { color: #b6bcc9; font-weight: 600; margin-bottom: 6px; }
</style>
</head>
<body>
  <img src="build/icon.png" alt="NEXT GAME" />
  <div class="spinner"></div>
  <p id="status">Conectando ao NEXT GAME...</p>
  <p id="hint" style="margin-top:8px; opacity:0.7;"></p>
</body>
</html>
